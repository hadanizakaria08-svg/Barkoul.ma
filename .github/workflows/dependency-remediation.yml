name: Barkoul dependency audit
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install the exact dependency tree
        run: npm ci --ignore-scripts --no-audit
      - name: Block high and critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report development advisories and block any high-risk runtime path
        run: |
          npm audit --json > npm-audit-full.json || true
          node --input-type=commonjs -e '
            const report = require("./npm-audit-full.json");
            const entries = Object.entries(report.vulnerabilities || {});
            for (const [name, item] of entries) {
              console.log(JSON.stringify({ package: name, severity: item.severity, developmentOnly: item.dev, via: item.via.map(v => typeof v === "string" ? v : v.name) }));
            }
            const blockers = entries.filter(([, item]) =>
              ["high", "critical"].includes(item.severity) && !item.dev
            );
            if (blockers.length) {
              console.error("Blocking high/critical vulnerabilities reachable from production dependencies:", blockers.map(([name]) => name).join(", "));
              process.exit(1);
            }
            const picomatch = report.vulnerabilities?.picomatch;
            if (picomatch && !picomatch.dev) {
              console.error("picomatch is not development-only; release gate failed.");
              process.exit(1);
            }
            if (picomatch) console.log("Accepted, isolated development-only advisory: GHSA-fc5q-39xc-vjpf. No patched npm release is currently listed; do not force a breaking downgrade.");
          '
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run browser, responsive and WCAG 2.2 AA checks
        run: npm run test:e2e
      - name: Commit the verified lockfile on the development branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock audited dependency tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "The audited lockfile is already current."
          fi
