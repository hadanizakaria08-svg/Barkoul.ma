name: Barkoul dependency audit
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a temporary lockfile without changing dependency ranges
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install dependencies from the generated lockfile
        run: npm ci --ignore-scripts --no-audit
      - name: Block high and critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report all dependency advisories without forced upgrades
        run: |
          npm audit --json > npm-audit-full.json || true
          node -e 'const r=require("./npm-audit-full.json"); const entries=Object.entries(r.vulnerabilities||{}); if (!entries.length) { console.log("No dependency advisories reported."); process.exit(0); } for (const [name,v] of entries) console.log(v.severity.toUpperCase()+" "+name+": "+(v.dev ? "development-only" : "production or mixed dependency path")+"; fixAvailable="+JSON.stringify(v.fixAvailable));'
      - name: Typecheck, tests and production build
        run: npm run check
