name: Deploy Barkoul.ma to GitHub Pages

on:
  workflow_run:
    workflows: ["Barkoul CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build deployable web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ajvpinnumhazuyziphwn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_kuEvoxEh2a0AAt8IMS5CWg_5oEO6gKn
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web/dist
      - name: Wait for the Pages artifact to become visible to the deployment API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              | jq --arg artifact "github-pages-$GITHUB_RUN_ATTEMPT" '[.artifacts[] | select(.name == $artifact)] | length')
            if [ "$count" -ge 1 ]; then
              echo "Pages artifact is visible (attempt $attempt); waiting for the Pages deployment API to catch up."
              sleep 10
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt $attempt/6); retrying in 5 seconds."
            sleep 5
          done
          echo "Pages artifact did not become visible to the deployment API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
