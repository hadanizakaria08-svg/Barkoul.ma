name: Barkoul dependency audit
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "scripts/**"
      - ".github/workflows/dependency-remediation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "scripts/**"
      - ".github/workflows/dependency-remediation.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate lockfile from reviewed manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Verify removed vulnerable packages are absent
        run: npm run security:runtime-deps
      - name: Block all dependency vulnerabilities
        run: npm audit
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run browser, responsive and WCAG 2.2 AA checks
        run: npm run test:e2e
      - name: Commit the verified lockfile on the development branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock dependency-free security baseline"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "The audited lockfile is already current."
          fi
