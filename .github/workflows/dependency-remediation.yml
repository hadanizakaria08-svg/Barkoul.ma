name: Barkoul dependency audit
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a temporary lockfile without changing dependency ranges
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install dependencies from the generated lockfile
        run: npm ci --ignore-scripts --no-audit
      - name: Report high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Typecheck, tests and production build
        run: npm run check
