name: Barkoul CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "rebuild/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependency tree from committed lockfile
        run: npm ci --ignore-scripts
      - name: Verify removed vulnerable packages are absent
        run: npm run security:runtime-deps
      - name: Scan application source for unsafe DOM and dynamic code sinks
        run: npm run security:source
      - name: Validate legacy HTML inline scripts and duplicate IDs
        run: npm run check:legacy-html
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install chromium
      - name: Run browser, responsive and WCAG 2.2 AA checks
        run: npm run test:e2e
