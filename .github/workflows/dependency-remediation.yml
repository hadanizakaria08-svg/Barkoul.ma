name: Barkoul dependency audit
on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - ".github/workflows/dependency-remediation.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install the exact dependency tree
        run: npm ci --ignore-scripts --no-audit
      - name: Block high and critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report all remaining dependency advisories
        run: |
          npm audit --json > npm-audit-full.json || true
          node --input-type=commonjs -e '
            const report = require("./npm-audit-full.json");
            const entries = Object.entries(report.vulnerabilities || {});
            for (const [name, item] of entries) {
              console.log(JSON.stringify({ package: name, severity: item.severity, via: item.via.map(v => typeof v === "string" ? v : v.name), fixAvailable: item.fixAvailable }));
            }
            console.log("The production release gate above is authoritative: npm audit --omit=dev must report zero high/critical production vulnerabilities.");
            console.log("Development-tool advisories remain visible in this report; do not force a breaking downgrade when the advisory has no patched release.");
          '
      - name: Typecheck, unit tests and production build
        run: npm run check
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run browser, responsive and WCAG 2.2 AA checks
        run: npm run test:e2e
      - name: Commit the verified lockfile on the development branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock audited dependency tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "The audited lockfile is already current."
          fi
