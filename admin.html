
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barkoul.ma | الإدارة</title>
<style>
body{font-family:Arial;background:#f3f7f4;margin:0;color:#173c2c}
main{max-width:650px;margin:35px auto;padding:16px}
section{background:white;padding:20px;border-radius:15px;margin:15px 0}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #ccd8d0}
button{background:#126747;color:white;font-weight:bold}
.card{padding:12px;border:1px solid #ddd;border-radius:9px;margin:10px 0}
.hidden{display:none}
#msg{overflow-wrap:anywhere;color:#a12626}
</style>
</head>
<body>
<main>
<h1>🔐 إدارة Barkoul.ma</h1>
<p>منطقة خاصة بالإدارة</p>

<section id="login">
<h2>دخول المدير</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني" value="hadanizakaria08@gmail.com">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn" type="button">تسجيل الدخول</button>
<p id="msg">الصفحة جاهزة لتسجيل الدخول.</p>
</section>

<section id="dashboard" class="hidden">
<h2>لوحة الإدارة</h2>
<p id="welcome"></p>
<h3>الشحنات</h3>
<div id="cargos">جارٍ التحميل...</div>
<button id="logoutBtn" type="button">تسجيل الخروج</button>
</section>
</main>

<script>
const msg=document.getElementById("msg");
const btn=document.getElementById("loginBtn");
const showError=e=>{msg.textContent="تعذر الدخول: "+(e.message||String(e));};

const loadSupabase=document.createElement("script");
loadSupabase.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
loadSupabase.onload=()=>{
 try{
  const db=supabase.createClient(
   "https://ajvpinnumhazuyziphwn.supabase.co",
   "sb_publishable_kuEvoxEh2a0AAt8IMS5CWg_5oEO6gKn"
  );

  btn.onclick=async()=>{
   btn.disabled=true;
   msg.textContent="جارٍ التحقق من الحساب...";
   try{
    const {data,error}=await db.auth.signInWithPassword({
     email:document.getElementById("email").value.trim(),
     password:document.getElementById("password").value
    });
    if(error) throw error;
    if(!data.user) throw new Error("لم يتم العثور على الحساب.");

    const {data:profile,error:pe}=await db.from("profiles")
      .select("role").eq("id",data.user.id).maybeSingle();

    if(pe) throw pe;
    if(!profile||profile.role!=="admin"){
     await db.auth.signOut();
     throw new Error("الحساب ليس لديه صلاحية الإدارة.");
    }

    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("welcome").textContent="تم تسجيل الدخول.";

    const area=document.getElementById("cargos");
    area.textContent="جارٍ تحميل الشحنات...";
    const {data:rows,error:ce}=await db.from("cargos")
      .select("id,title,origin_city,destination_city,status")
      .order("created_at",{ascending:false}).limit(100);

    if(ce){area.textContent="تعذر تحميل الشحنات: "+ce.message;return;}
    area.textContent="";
    if(!rows||!rows.length){area.textContent="لا توجد شحنات.";return;}
    rows.forEach(c=>{
     const div=document.createElement("div");
     div.className="card";
     div.textContent=(c.title||"شحنة")+" — "+
       (c.origin_city||"؟")+" ← "+(c.destination_city||"؟")+
       " — "+(c.status||"");
     area.appendChild(div);
    });
   }catch(e){showError(e);}
   finally{btn.disabled=false;}
  };

  document.getElementById("logoutBtn").onclick=async()=>{
   await db.auth.signOut();
   location.reload();
  };
 }catch(e){showError(e);}
};
loadSupabase.onerror=()=>{
 msg.textContent="تعذر تحميل خدمة تسجيل الدخول. تحقق من اتصال الإنترنت.";
};
document.head.appendChild(loadSupabase);
</script>
</body>
</html>
