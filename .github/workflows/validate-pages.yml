name: Validate Barkoul pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/security-and-ui-2026-11-20"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML inline scripts, IDs, and public secrets
        run: node scripts/validate-pages.mjs
